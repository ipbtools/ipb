name: CI test package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS 27 ARM64 build and host tests
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check Apple build environment
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          xcodebuild -version
          xcodebuild -version | head -1 | /usr/bin/grep -Eq '^Xcode 27[.]'
          sudo xcodebuild -runFirstLaunch
          test -d "$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/PrivateFrameworks"
          for framework in \
            /Library/Developer/PrivateFrameworks/CoreDevice.framework \
            /Library/Developer/PrivateFrameworks/CoreDeviceUtilities.framework \
            /Library/Developer/PrivateFrameworks/CoreDevice.framework/Frameworks/UniversalHID.framework \
            /Library/Apple/System/Library/PrivateFrameworks/Mercury.framework; do
            test -d "$framework" || { echo "Missing framework: $framework" >&2; exit 1; }
          done
          sw_vers
      - name: Build all native targets
        run: make -j3 all
      - name: Run host regressions
        run: make check-host
      - name: Stage and verify test package
        env:
          IPB_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/package_test_build.py "$RUNNER_TEMP/ipb-package"
      - name: Upload test package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipb-macos27-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ipb-package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Summarize verification scope
        env:
          ARTIFACT_URL: ${{ steps.package.outputs.artifact-url }}
        run: |
          {
            echo '### CI test package'
            echo "Download: $ARTIFACT_URL"
            echo 'Native ARM64 build, host regressions, archive checksum, extracted layout and host startup passed.'
            echo 'This is a development package. Physical HID/media/AX and download quarantine behavior remain separate verification gates.'
          } >> "$GITHUB_STEP_SUMMARY"
